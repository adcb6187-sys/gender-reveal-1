<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="초음파 사진을 보고 아기의 성별을 맞춰보세요! 카드 뒤집기 젠더리빌" />
  <meta property="og:image" content="http://gender-reveal.kro.kr/ultrasound.jpeg" />
  <title>🃏 꾸미 성별 맞추기 · 카드 젠더리빌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ========== 화면 0: 시작 페이지 ========== -->
    <section id="screen-start" class="screen is-active">
      <div class="start-card">
        <div class="start-emoji">👶</div>
        <h1 class="start-title">오뚝이<br />성별 맞추기</h1>
        <p class="start-sub">초음파 사진을 보고<br />꾸미의 성별을 맞춰보세요!</p>
        <button class="btn-primary" id="btn-start">시작하기 ✨</button>
        <p class="start-foot">함께해 주셔서 감사합니다 💕</p>
      </div>
    </section>

    <!-- ========== 화면 1: 초음파 + 성별 선택 ========== -->
    <section id="screen-guess" class="screen">
      <h2 class="guess-title">초음파 사진을 보고<br />꾸마의 성별을 맞춰보세요</h2>
      <div class="photo-frame">
        <img src="ultrasound.jpeg" alt="초음파 사진" class="photo" />
        <span class="photo-tape photo-tape--l"></span>
        <span class="photo-tape photo-tape--r"></span>
      </div>
      <p class="guess-sub">당신의 예상을 골라주세요! 👇</p>
      <div class="choice-row">
        <button class="choice choice--boy" data-guess="boy">
          <span class="choice__emoji">👦</span>
          <span class="choice__label">아들</span>
        </button>
        <button class="choice choice--girl" data-guess="girl">
          <span class="choice__emoji">👧</span>
          <span class="choice__label">딸</span>
        </button>
      </div>
    </section>

    <!-- ========== 화면 2: 카드 뒤집기 게임 ========== -->
    <section id="screen-game" class="screen">
      <div class="game-top">
        <p class="game-guess" id="game-guess"></p>
        <h2 class="game-title">카드를 뒤집어 주세요!</h2>
        <p class="game-desc">가로·세로·대각선으로 같은 그림이<br /><b>3장 연속</b> 나오면 성별이 공개돼요! 🃏</p>
      </div>

      <div class="card-grid" id="card-grid">
        <!-- 카드 9장은 script.js에서 생성 -->
      </div>

      <p class="game-hint" id="game-hint">👆 카드를 하나씩 뒤집어 보세요!</p>
    </section>

    <!-- ========== 화면 3: 결과 공개 ========== -->
    <section id="screen-reveal" class="screen">
      <div class="reveal-card" id="reveal-card">
        <p class="reveal-eyebrow">두구두구두구… 🥁</p>
        <div class="doll" id="reveal-doll">
          <div class="doll__body">
            <div class="doll__face">
              <span class="doll__eye"></span>
              <span class="doll__eye"></span>
              <span class="doll__mouth doll__mouth--smile"></span>
            </div>
          </div>
        </div>
        <h2 class="reveal-title" id="reveal-title"></h2>
        <p class="reveal-message" id="reveal-message"></p>
        <button class="btn-primary" id="reveal-again">🔄 다시 하기</button>
      </div>
    </section>

    <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
