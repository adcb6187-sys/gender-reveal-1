<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="초음파 사진을 보고 아기의 성별을 맞춰보세요! 다트 젠더리빌" />
  <title>🎯 초음파 성별 맞추기 · 다트 젠더리빌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ========== 화면 0: 시작 페이지 ========== -->
    <section id="screen-start" class="screen is-active">
      <div class="start-card">
        <div class="start-emoji">👶🎯</div>
        <h1 class="start-title">우리 아기<br />성별 맞추기</h1>
        <p class="start-sub">초음파 사진을 보고<br />오뚝이의 성별을 맞춰보세요!</p>
        <button class="btn-primary" id="btn-start">시작하기 ✨</button>
        <p class="start-foot">함께해 주셔서 감사합니다 💕</p>
      </div>
    </section>

    <!-- ========== 화면 1: 초음파 + 성별 선택 ========== -->
    <section id="screen-guess" class="screen">
      <h2 class="guess-title">이 초음파 사진 속<br />아기는 누구일까요?</h2>
      <div class="photo-frame">
        <img src="ultrasound.jpeg" alt="초음파 사진" class="photo" />
        <span class="photo-tape photo-tape--l"></span>
        <span class="photo-tape photo-tape--r"></span>
      </div>
      <p class="guess-sub">당신의 예상을 골라주세요! 👇</p>
      <div class="choice-row">
        <button class="choice choice--boy" data-guess="boy">
          <span class="choice__emoji">👦</span>
          <span class="choice__label">남자아이</span>
        </button>
        <button class="choice choice--girl" data-guess="girl">
          <span class="choice__emoji">👧</span>
          <span class="choice__label">여자아이</span>
        </button>
      </div>
    </section>

    <!-- ========== 화면 2: 다트로 풍선 터뜨리기 ========== -->
    <section id="screen-game" class="screen">
      <div class="game-top">
        <p class="game-guess" id="game-guess"></p>
        <h2 class="game-title">다트로 풍선을 맞춰요!</h2>
        <p class="game-desc">조준선이 좌우로 흔들려요.<br />풍선을 향할 때 <b>던지기</b>! 🎯</p>
      </div>

      <div class="game-stage" id="game-stage">
        <!-- 풍선 (과녁) -->
        <div class="balloon" id="balloon" aria-label="풍선 과녁">
          <span class="balloon__body">
            <span class="balloon__shine"></span>
            <span class="balloon__mark">?</span>
          </span>
          <span class="balloon__knot"></span>
          <span class="balloon__string"></span>
        </div>

        <!-- 조준선 + 다트 (하단 중앙 회전) -->
        <div class="aim" id="aim">
          <span class="aim__line"></span>
          <span class="dart" id="dart">
            <span class="dart__tip"></span>
            <span class="dart__shaft"></span>
            <span class="dart__fin"></span>
          </span>
        </div>
      </div>

      <button class="btn-throw" id="btn-throw">🎯 던지기!</button>
      <p class="game-hint" id="game-hint">조준선이 풍선을 향할 때 버튼을 누르세요!</p>
    </section>

    <!-- ========== 화면 3: 결과 공개 ========== -->
    <section id="screen-reveal" class="screen">
      <div class="reveal-card" id="reveal-card">
        <p class="reveal-eyebrow">두구두구두구… 🥁</p>
        <div class="doll" id="reveal-doll">
          <div class="doll__body">
            <div class="doll__face">
              <span class="doll__eye"></span>
              <span class="doll__eye"></span>
              <span class="doll__mouth doll__mouth--smile"></span>
            </div>
          </div>
        </div>
        <h2 class="reveal-title" id="reveal-title"></h2>
        <p class="reveal-message" id="reveal-message"></p>
        <button class="btn-primary" id="reveal-again">🔄 다시 하기</button>
      </div>
    </section>

    <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
